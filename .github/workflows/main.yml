steps:

  - name: Descargar repositorio

    uses: actions/checkout@v4

  - name: Configurar Python

    uses: actions/setup-python@v5

    with:

      python-version: '3.11'

  - name: Instalar dependencias

    run: |

      python -m pip install --upgrade pip

      pip install -r requirements.txt

  - name: Verificar configuración

    env:

      OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    run: |

      python -c "import os, sys; names=['OPENFOOT_API_KEY','TELEGRAM_BOT_TOKEN','TELEGRAM_CHAT_ID']; missing=[n for n in names if not os.getenv(n)]; print('Faltan secretos: '+', '.join(missing) if missing else 'Los tres secretos están configurados'); sys.exit(1 if missing else 0)"

  - name: Ejecutar bot de fútbol

    env:

      OPENFOOT_API_KEY: ${{ secrets.OPENFOOT_API_KEY }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    run: python bot.py
