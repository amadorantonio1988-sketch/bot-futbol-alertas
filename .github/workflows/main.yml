

name: Bot fútbol alertas

on:

  workflow_dispatch:

  schedule:

    - cron: "15 12 * * *"

    - cron: "0 15 * * *"

    - cron: "0 18 * * *"

    - cron: "0 21 * * *"

permissions:

  contents: read

jobs:

  bot-futbol:

    runs-on: ubuntu-latest

    env:

      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Descargar repositorio

        uses: actions/checkout@v4

      - name: Configurar Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Instalar dependencias

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      - name: Verificar secretos

        run: |

          test -n "$THE_ODDS_API_KEY" || (echo "Falta THE_ODDS_API_KEY" && exit 1)

          test -n "$TELEGRAM_BOT_TOKEN" || (echo "Falta TELEGRAM_BOT_TOKEN" && exit 1)

          test -n "$TELEGRAM_CHAT_ID" || (echo "Falta TELEGRAM_CHAT_ID" && exit 1)

      - name: Ejecutar bot

        run: python bot.py
